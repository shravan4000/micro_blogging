{% extends 'base.html' %}

{% block title %}Edit Profile - Microblog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-lg">
            <div class="card-body p-5">
                <h2 class="mb-4 fw-bold">Edit Profile</h2>
                <form method="POST" enctype="multipart/form-data">
                    <div class="text-center mb-4">
                        <img id="profile-preview"
                            src="{{ url_for('static', filename='uploads/' + user.profile_image) }}"
                            class="rounded-circle img-thumbnail mb-3" alt="{{ user.username }}"
                            style="width: 100px; height: 100px; object-fit: cover;">
                    </div>

                    <div class="mb-4">
                        <label for="profile_image" class="form-label fw-bold">Profile Picture</label>
                        <input type="file" class="form-control" id="profile_image" name="profile_image" accept="image/*"
                            onchange="previewImage(this, 'profile-preview')">
                    </div>

                    <script>
                        function previewImage(input, previewId) {
                            if (input.files && input.files[0]) {
                                var reader = new FileReader();
                                reader.onload = function (e) {
                                    document.getElementById(previewId).src = e.target.result;
                                }
                                reader.readAsDataURL(input.files[0]);
                            }
                        }
                    </script>

                    <div class="mb-4">
                        <label for="bio" class="form-label fw-bold">Bio</label>
                        <textarea class="form-control" id="bio" name="bio" rows="5"
                            placeholder="Tell us about yourself...">{{ user.bio or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('user_profile', username=user.username) }}"
                            class="btn btn-light px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
