{% extends 'base.html' %}

{% block title %}Edit Blog - Microblog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-lg">
            <div class="card-body p-5">
                <h2 class="mb-4 fw-bold">Edit Blog Post</h2>
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label for="title" class="form-label text-muted small fw-bold">TITLE</label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title"
                            value="{{ blog.title }}" required>
                    </div>
                    <div class="mb-4">
                        <label for="category" class="form-label text-muted small fw-bold">CATEGORY</label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="" disabled>Select a category</option>
                            {% for category in categories %}
                            <option value="{{ category.id }}" {% if blog.category and blog.category.id==category.id
                                %}selected{% endif %}>{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="image" class="form-label text-muted small fw-bold">CHANGE COVER IMAGE</label>
                        <input type="file" class="form-control mb-2" id="image" name="image" accept="image/*"
                            onchange="previewImage(this, 'preview-image')">
                        <div class="mb-2">
                            {% if blog.image_file %}
                            <img id="preview-image" src="{{ url_for('static', filename='uploads/' + blog.image_file) }}"
                                alt="Current Image" class="img-fluid rounded shadow-sm"
                                style="max-height: 300px; object-fit: cover;">
                            <small class="text-muted d-block mt-1">Current Image</small>
                            {% else %}
                            <img id="preview-image" src="#" alt="Image Preview"
                                class="img-fluid rounded shadow-sm d-none"
                                style="max-height: 300px; object-fit: cover;">
                            {% endif %}
                        </div>
                    </div>

                    <script>
                        function previewImage(input, previewId) {
                            if (input.files && input.files[0]) {
                                var reader = new FileReader();
                                reader.onload = function (e) {
                                    var preview = document.getElementById(previewId);
                                    preview.src = e.target.result;
                                    preview.classList.remove('d-none');
                                }
                                reader.readAsDataURL(input.files[0]);
                            }
                        }
                    </script>
                    <div class="mb-4">
                        <label for="description" class="form-label text-muted small fw-bold">CONTENT</label>
                        <textarea class="form-control" id="description" name="description" rows="10"
                            required>{{ blog.description }}</textarea>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('blog', blog_id=blog.id) }}" class="btn btn-light px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Update Post</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
